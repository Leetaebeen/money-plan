name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --audit=false

      - name: Validate commit messages
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/validate-commit-range.cjs "$BEFORE_SHA" "$AFTER_SHA"

      - name: Check tracked files for secrets
        run: npm run security:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build PWA
        run: npm run build:web
